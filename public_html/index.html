<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đặt Cơm IDEA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout: one mobile column, sticky header, bottom tab bar, one orange action bar per screen */
:root{
  --bg:#F6F6F6; --card:#FFFFFF; --ink:#1F1F1F; --ink2:#6B6B6B; --line:#EFEFEF; --chip:#EFEFEF;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.06);
  --brand:#FE5137; --brand-ink:#FFFFFF; --tint:#FFEDE9; --tint-line:#FFCABF;
  --ok:#2E7D4F; --okbg:#E5F3EA; --warn:#9A5B0A; --warnbg:#FCF0D8; --bad:#B3261E; --badbg:#FBE8E6;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --nav-h:68px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#191816; --card:#25231F; --ink:#F3F1EC; --ink2:#A29E96; --line:#34312D; --chip:#34312D; --shadow:none;
  --tint:#40211B; --tint-line:#6A3027; --ok:#6FCB93; --okbg:#1F3327; --warn:#E3B05B; --warnbg:#3A2D14; --bad:#F2928B; --badbg:#3E2220;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191816; --card:#25231F; --ink:#F3F1EC; --ink2:#A29E96; --line:#34312D; --chip:#34312D; --shadow:none;
  --tint:#40211B; --tint-line:#6A3027; --ok:#6FCB93; --okbg:#1F3327; --warn:#E3B05B; --warnbg:#3A2D14; --bad:#F2928B; --badbg:#3E2220;
  color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;font-weight:500;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:800}
#app{max-width:560px;margin:0 auto;min-height:100vh;position:relative}
header.top{position:sticky;top:0;z-index:20;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.mark{width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.hb{flex:1;min-width:0}
.hb b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb small{color:var(--ink2);font-size:13px}
main{padding:14px 16px calc(var(--nav-h) + 110px + env(safe-area-inset-bottom))}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;z-index:20;background:var(--card);box-shadow:0 -4px 16px rgba(0,0,0,.06);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--ink2);cursor:pointer;position:relative;min-height:var(--nav-h)}
nav.tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--brand);font-weight:600}
nav.tabs .badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:9px;min-width:17px;height:17px;font-size:10px;display:grid;place-items:center;padding:0 4px}
.actbar{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:560px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));z-index:19;padding:10px 16px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.actbar:empty{display:none}
.btn{border:1px solid transparent;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;text-align:center}
.btn.primary{background:var(--brand);color:var(--brand-ink);width:100%;font-size:16px;box-shadow:0 4px 14px rgba(254,81,55,.32)}
.btn.primary:active{filter:brightness(.92)}
.btn.primary[disabled]{opacity:.5;box-shadow:none}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.sm{padding:6px 12px;min-height:40px;font-size:14px;border-radius:10px}
.btn.full{width:100%}
.btn.link{background:none;border:0;color:var(--ink2);padding:6px 8px;min-height:40px;font-weight:500;font-size:14px}
.btn.danger{color:var(--bad)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.card{background:var(--card);box-shadow:var(--shadow);border-radius:18px;padding:14px;margin-bottom:12px}
.card.flat{padding:0;overflow:hidden}
.card h3{font-size:15px;margin-bottom:8px}
.row{display:flex;gap:10px;align-items:center}
.row.sb{justify-content:space-between}
.grow{flex:1;min-width:0}
.sub{color:var(--ink2);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--bg);color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)} .chip.warn{background:var(--warnbg);color:var(--warn)} .chip.bad{background:var(--badbg);color:var(--bad)} .chip.brand{background:var(--tint);color:var(--brand)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:14px;font-weight:600;color:var(--ink2)}
.field input,.field select,.field textarea{border:0;background:var(--chip);border-radius:14px;padding:12px 14px;width:100%;min-height:48px}
.field textarea{min-height:72px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.strip{display:flex;gap:6px;align-items:stretch;margin-bottom:12px}
.strip .nav{flex:none;width:26px;border:0;background:none;font-size:22px;color:var(--ink2);cursor:pointer}
.strip .days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;flex:1}
.day{background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:6px 0 7px;text-align:center;cursor:pointer;position:relative}
.day small{display:block;font-size:12px;color:var(--ink2)}
.day b{font-size:16px}
.day.on{background:var(--brand);box-shadow:0 4px 12px rgba(254,81,55,.3)}
.day.on small,.day.on b{color:#fff}
.day .dot{position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ok)}
.day.on .dot{background:#fff}
.day.past{opacity:.6}
.note{background:var(--tint);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.note b{color:var(--brand)}
[hidden]{display:none!important}
.cutoff{padding:6px 12px;border-radius:99px;font-weight:700;font-size:14px}
.notepill{background:var(--tint);border-radius:14px;padding:6px 12px;font-size:14px}
.no.sm{min-width:30px;height:30px;font-size:13px;border-radius:9px}
.nums{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:5px}
.cutoff.ok{background:var(--okbg);color:var(--ok)} .cutoff.warn{background:var(--warnbg);color:var(--warn)} .cutoff.bad{background:var(--badbg);color:var(--bad)}
.mine{display:flex;align-items:center;gap:10px;padding:16px;cursor:pointer;background:var(--tint);color:var(--brand);font-size:17px}
.mine b{font-weight:800}
.chev{font-size:16px;color:var(--brand)}
input[type=search]{-webkit-appearance:none;appearance:none}
.dish{display:flex;gap:12px;padding:12px 14px;align-items:center;border-top:1px solid var(--line);cursor:pointer}
.dish:first-child{border-top:0}
.dish.off{cursor:default;opacity:.55}
.thumb{width:76px;height:76px;border-radius:12px;object-fit:cover;background:var(--tint);flex:none;display:grid;place-items:center;color:var(--brand);font-weight:700;font-size:26px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.s{width:48px;height:48px;font-size:18px;border-radius:10px}
.dname{font-weight:500;font-size:16px;line-height:1.3}
.price{font-weight:500;color:var(--ink2);font-size:15px;margin-top:2px}
.plus{flex:none;width:30px;height:30px;border-radius:50%;border:0;background:transparent;box-shadow:inset 0 0 0 1px var(--brand);color:var(--brand);font-size:20px;font-weight:300;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0}
.dish.off .plus{display:none}
.orow{display:flex;gap:12px;padding:10px 14px;border-top:1px solid var(--line);align-items:flex-start}
.orow:first-child{border-top:0}
.orow.me{background:var(--tint)}
.orow.x{opacity:.5;text-decoration:line-through}
.no{flex:none;min-width:32px;height:32px;border-radius:9px;background:transparent;color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);display:grid;place-items:center;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.ob{flex:1;min-width:0}
.ob b{display:block;font-weight:500;font-size:15px;line-height:1.35}
.ob small{color:var(--ink2);display:block;font-size:13px;margin-top:1px}
.acts{display:flex;gap:4px;flex:none}
.ib{width:32px;height:32px;padding:0;min-height:0;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1px #C9C9C9;color:#8A8A8A;display:inline-grid;place-items:center;cursor:pointer;border:0}
.ib svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:disabled{opacity:.35;cursor:default}
.bar{height:4px;border-radius:3px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:5px}
.bar.g i{background:var(--ink2)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat .card{margin:0}
.stat b{font-size:22px;display:block;font-variant-numeric:tabular-nums}
.vbars{display:flex;align-items:flex-end;gap:3px;height:90px}
.vbars{height:80px;margin-top:10px}
.vbars div{flex:1;background:var(--tint);border-radius:3px 3px 0 0;min-height:2px}
.vbars div.pk{background:var(--brand)}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mnav b{font-size:17px;font-weight:600}
.mnav button{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);color:var(--ink2);display:grid;place-items:center;cursor:pointer;padding:0}
.mnav button:disabled{opacity:.35;cursor:default}
.mnav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dp{position:relative;flex:1;min-width:0;background:var(--chip);border-radius:14px;padding:9px 14px;display:block;cursor:pointer}
.dp small{display:block;font-size:12px;color:var(--ink2)}
.dp b{display:block;font-size:16px;font-weight:500;margin-top:1px}
.dp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer;border:0;padding:0;min-height:0}
.dpa{color:var(--ink2);flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipb{border:0;background:var(--chip);color:var(--ink2);border-radius:99px;padding:7px 12px;font-size:14px;font-weight:500;cursor:pointer}
.chipb.on{background:var(--tint);color:var(--brand);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpis div{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.kpis span{display:block;font-size:13px;color:var(--ink2)}
.kpis b{display:block;font-size:18px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rk{display:flex;gap:10px;align-items:flex-start;margin-top:12px}
.rn{flex:none;width:18px;color:var(--ink2);font-size:14px;padding-top:1px}
.rm{flex:1;min-width:0}
.rm .row>span:first-child{font-size:15px;font-weight:500}
.rv{color:var(--ink2);font-size:14px;font-variant-numeric:tabular-nums}
.rm .bar{margin-top:6px}
.dbt{padding:7px 0;font-size:15px}
.seg{display:flex;background:var(--chip);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;font-size:14px;line-height:1.2;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}
.empty{text-align:center;padding:30px 16px;color:var(--ink2)}
#modal[hidden]{display:none}
.scrim{position:fixed;inset:0;background:rgba(20,18,15,.5);z-index:40}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;z-index:41;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{font-size:18px;margin-bottom:12px}
.sheet .x{position:absolute;top:10px;right:10px}
.stepper{display:flex;align-items:center;gap:14px;justify-content:center;margin:6px 0 14px}
.stepper button{width:42px;height:42px;border-radius:50%;border:0;background:var(--chip);font-size:22px;cursor:pointer;padding:0}
.stepper b{font-size:20px;min-width:30px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 90px);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;z-index:60;max-width:90%;font-size:14px}
.login{padding:36px 8px 10px;text-align:center}
.mark svg{width:26px;height:26px;display:block}
.btn.primary.short{width:auto;min-width:200px;padding-left:36px;padding-right:36px;display:flex;margin:8px auto 0}
.login .mark{width:60px;height:60px;border-radius:18px;font-size:32px;margin:0 auto 14px}
.login h1{font-size:24px;margin-bottom:4px}
.login form{text-align:left;margin-top:22px}
.qr{width:220px;max-width:70%;margin:6px auto 10px;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);background:#fff;display:block}
.qr svg{display:block;width:100%;height:auto}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{border-top:0}
.kv span:first-child{color:var(--ink2)}
.kv b{text-align:right;word-break:break-all}
details summary{cursor:pointer;color:var(--ink2);font-size:13px;margin-top:8px}
details.inv{margin-top:10px}
details.inv summary{color:var(--brand);font-weight:600;font-size:14px;list-style:none;padding:4px 0}
details.inv summary::-webkit-details-marker{display:none}
details.inv summary::after{content:' ▾'}
details.inv[open] summary::after{content:' ▴'}
.il{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.il:first-of-type{margin-top:6px}
.ild{flex:none;width:40px;color:var(--ink2);font-size:14px;padding-top:1px}
.ilm{flex:1;min-width:0;font-size:15px;font-weight:500}
.ilm small{display:block;color:var(--ink2);font-weight:400;font-size:13px;margin-top:1px}
.ilp{flex:none;color:var(--ink2);font-size:14px;padding-top:1px;white-space:nowrap}
.stk{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stk div{background:var(--chip);border-radius:12px;padding:10px 12px;font-size:14px}
.stk .n{font-size:26px;font-weight:700;line-height:1}
.prevm{width:90px;height:90px;border-radius:12px;background:var(--tint);overflow:hidden;display:grid;place-items:center;color:var(--brand);font-size:12px;text-align:center}
.prevm img{width:100%;height:100%;object-fit:cover}
.sw{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.sw.auto{margin:-4px 2px 12px;align-items:center;color:var(--ink2);font-size:14px}
.sw input{width:20px;height:20px;margin-top:2px;accent-color:#FE5137}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translate(-50%,30px);opacity:.6}}}
</style>
</head>
<body>
<div id="app">
  <header class="top" id="hdr"></header>
  <main id="view"></main>
  <div class="actbar" id="act"></div>
  <nav class="tabs" id="nav" hidden></nav>
</div>
<div id="modal" hidden></div>
<div id="toast"></div>

<script src="db-client.js"></script>
<script>
'use strict';
/* ========= helpers ========= */
const $=id=>document.getElementById(id);
const pad=(n,l=2)=>String(n).padStart(l,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return dkey(d)};
const todayKey=()=>dkey(new Date());
const DOW=['CN','T2','T3','T4','T5','T6','T7'];
const fmtDate=k=>{const d=parseKey(k);return pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const money=n=>(Math.round(n)||0).toLocaleString('vi-VN')+'đ';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=id=>{const e=$(id);return e?e.value.trim():''};
const BANKS=[['970436','Vietcombank'],['970415','VietinBank'],['970418','BIDV'],['970405','Agribank'],['970407','Techcombank'],['970422','MB Bank'],['970416','ACB'],['970432','VPBank'],['970423','TPBank'],['970403','Sacombank'],['970441','VIB'],['970437','HDBank'],['970448','OCB'],['970426','MSB'],['970443','SHB'],['970440','SeABank']];
const ICON={
 box:'M4 7l8-4 8 4v10l-8 4-8-4zM4 7l8 4 8-4M12 11v10',
 list:'M4 6h16M4 12h16M4 18h10',
 people:'M9 11a3 3 0 100-6 3 3 0 000 6zM3 20c0-3 3-5 6-5s6 2 6 5M17 11a2.5 2.5 0 100-5M17 15c2.5 0 4 1.5 4 4',
 clock:'M12 7v5l3 2M21 12a9 9 0 11-3-6.7M21 4v4h-4',
 card:'M3 7h18v10H3zM3 11h18',
 chart:'M4 20V10M10 20V4M16 20v-8M22 20H2',
 dish:'M3 12h18a9 9 0 01-18 0zM8 8c0-2 2-2 2-4M13 8c0-2 2-2 2-4',
 receipt:'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6'
};
const LOGO='<div class="mark"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M4 16h24c0 6.4-5.3 10.5-12 10.5S4 22.4 4 16z" fill="#fff"/><path d="M8 16c.9-3.8 4-6.3 8-6.3s7.1 2.5 8 6.3z" fill="#fff" fill-opacity=".78"/><path d="M20.5 3.5l-6 7.5M24.5 5.5l-7 8" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><path d="M12 28.5h8" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/></svg></div>';
const ico=n=>'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+ICON[n]+'"/></svg>';

/* ========= state ========= */
const S={db:null,dl:null,me:null,role:null,tab:'menu',date:todayKey(),off:0,
 dishes:[],days:{},orders:[],invoices:[],users:[],settings:null,loaded:{},slow:false,
 cart:{},showMine:false,q:'',draft:null,sheet:null,form:null,invFilter:'unpaid',statMonth:null,sortBy:'no',
 login:{step:'form',name:'',phone:''},autoRan:false,subsAfter:false};
const cutoffT=()=>(S.settings&&S.settings.cutoff)||'10:00';
function isClosed(k){const t=todayKey();if(k<t)return true;if(k>t)return false;const n=new Date();return (pad(n.getHours())+':'+pad(n.getMinutes()))>=cutoffT()}
function minsLeft(){const p=cutoffT().split(':').map(Number);const n=new Date();return p[0]*60+p[1]-(n.getHours()*60+n.getMinutes())}
function leftText(){const d=minsLeft();if(d<=0)return '';return d>=60?('còn '+Math.floor(d/60)+'g '+pad(d%60)+'p'):('còn '+d+'p')}
function fold(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase()}
function applyFilter(){if(!document.querySelectorAll)return;const q=fold(S.q||'').trim();document.querySelectorAll('#view [data-s]').forEach(e=>{e.hidden=q?e.dataset.s.indexOf(q)<0:false})}
const qbox=()=>'<div class="field"><input id="q" type="search" data-in="q" autocomplete="off" placeholder="Tìm theo tên hoặc món…" value="'+esc(S.q)+'" aria-label="Tìm kiếm"></div>';
const myActive=k=>S.orders.filter(o=>o.date===k&&o.phone===S.me.phone&&o.status==='active').sort((a,b)=>a.createdAt-b.createdAt);

function sub(name,q,fn){

const dayOrders=k=>S.orders.filter(o=>o.date===k&&o.status==='active').sort((a,b)=>((a.createdAt||0)-(b.createdAt||0))||(a.id<b.id?-1:1));
const numbered=k=>dayOrders(k).map((o,i)=>({o:o,no:pad(i+1)}));
const dayDishes=k=>{const d=S.days[k];return ((d&&d.dishIds)||[]).map(id=>S.dishes.find(x=>x.id===id)).filter(x=>x&&x.active!==false)};
function billedMap(){const m={};S.invoices.forEach(i=>(i.orderIds||[]).forEach(id=>{m[id]=i}));return m}
function unbilled(){const b=billedMap();return S.orders.filter(o=>o.status==='active'&&isClosed(o.date)&&!b[o.id])}
const sumBy=(arr,f)=>arr.reduce((s,x)=>s+(f(x)||0),0);
function dishSum(list){const m={};list.forEach(o=>{const k=o.dishName;m[k]=(m[k]||0)+1});return Object.keys(m).map(k=>({name:k,n:m[k]})).sort((a,b)=>b.n-a.n)}

async function hashPin(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('idea-com|'+p));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;const s='idea-com|'+p;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return 'x'+h}}
async function ensureUser(name,phone){
  const ref=S.db.doc('users/'+phone);const s=await ref.get();
  if(s.exists)return Object.assign({id:phone},s.data());
  const all=await S.db.collection('users').get();let max=0;all.docs.forEach(d=>{max=Math.max(max,d.data().seq||0)});
  const seq=max+1;const data={phone:phone,name:name,seq:seq,code:name+'-user-'+pad(seq,3),createdAt:Date.now(),autoDefault:false,autoDone:{}};
  await ref.set(data);
  // nhiều người đăng ký cùng lúc có thể trùng số: kiểm tra lại, ai đến sau (hoặc nhỏ hơn theo SĐT) thì lấy số kế tiếp
  for(let t=0;t<14;t++){
    await new Promise(r=>setTimeout(r,60+Math.random()*140));
    const cur=await S.db.collection('users').get();const us=cur.docs.map(d=>d.data());
    const lose=us.some(u=>u.phone!==phone&&u.seq===data.seq&&((u.createdAt||0)<data.createdAt||((u.createdAt||0)===data.createdAt&&String(u.phone)<String(phone))));
    if(!lose)break;
    let mx=0;us.forEach(u=>{mx=Math.max(mx,u.seq||0)});
    data.seq=mx+1;data.code=name+'-user-'+pad(data.seq,3);await ref.update({seq:data.seq,code:data.code});
  }
  return Object.assign({id:phone},data);
}
async function addOrder(k,dish,note,by,who,t){
  const u=who||S.me;
  const r=await S.db.collection('orders').add({date:k,phone:u.phone,code:u.code,name:u.name,dishId:dish.id,dishName:dish.name,price:dish.price||0,note:note||'',status:'active',by:by||'user',createdAt:t||Date.now()});return r.id;
}
async function runAuto(){
  const me=S.me;if(!me.autoDefault)return;
  for(let i=0;i<7;i++){
    const k=addDays(todayKey(),i);if(isClosed(k))continue;
    const ds=dayDishes(k);if(!ds.length)continue;
    if(me.autoDone&&me.autoDone[k])continue;
    if(S.orders.some(o=>o.date===k&&o.phone===me.phone))continue;
    await safe(async()=>{const ref=S.db.doc('orders/auto_'+me.phone+'_'+k);const ex=await ref.get();if(!ex.exists)await ref.set({date:k,phone:me.phone,code:me.code,name:me.name,dishId:ds[0].id,dishName:ds[0].name,price:ds[0].price||0,note:'Mặc định',status:'active',by:'auto',createdAt:Date.now()});const patch={};patch[k]=true;await S.db.doc('users/'+me.phone).update({autoDone:patch});me.autoDone=Object.assign({},me.autoDone,patch)});
  }
}

/* ========= VietQR ========= */
const tlv=(id,v)=>id+pad(String(v).length)+v;
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function vietqr(bin,acc,amount,memo){
  const m=tlv('00','A000000727')+tlv('01',tlv('00',bin)+tlv('01',acc))+tlv('02','QRIBFTTA');
  const p=tlv('00','01')+tlv('01','12')+tlv('38',m)+tlv('53','704')+tlv('54',String(Math.round(amount)))+tlv('58','VN')+tlv('62',tlv('08',memo))+'6304';
  return p+crc16(p);
}
function qrSvg(text){
  if(typeof qrcode!=='function')return '';
  try{const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount();let d='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+='M'+(c+2)+' '+(r+2)+'h1v1h-1z';
    return '<svg viewBox="0 0 '+(n+4)+' '+(n+4)+'" shape-rendering="crispEdges" role="img" aria-label="Mã QR thanh toán"><rect width="100%" height="100%" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>'}catch(e){return ''}
}
function payBlock(inv){
  const b=S.settings&&S.settings.bank;
  if(!b||!b.bin||!b.acc)return '<div class="note">Admin chưa nhập tài khoản ngân hàng. Hỏi admin để chuyển khoản.</div>';
  const svg=qrSvg(vietqr(b.bin,b.acc,inv.total,inv.code));
  const bn=(BANKS.find(x=>x[0]===b.bin)||[0,'Ngân hàng'])[1];
  return (svg?'<div class="qr">'+svg+'</div>':'<div class="note">Không tải được thư viện QR. Chuyển khoản theo thông tin bên dưới.</div>')+
   '<div class="kv"><span>Ngân hàng</span><b>'+esc(bn)+'</b></div><div class="kv"><span>Số tài khoản</span><b>'+esc(b.acc)+'</b></div>'+
   '<div class="kv"><span>Chủ tài khoản</span><b>'+esc(b.name||'')+'</b></div><div class="kv"><span>Số tiền</span><b>'+money(inv.total)+'</b></div>'+
   '<div class="kv"><span>Nội dung</span><b>'+esc(inv.code)+'</b></div>'+
   '<div class="row" style="margin-top:10px"><button class="btn ghost sm grow" data-act="copy" data-t="'+esc(b.acc)+'">Chép số tài khoản</button><button class="btn ghost sm grow" data-act="copy" data-t="'+esc(inv.code)+'">Chép nội dung</button></div>';
}

function vStats(){
  const tdy=todayKey(),curM=tdy.slice(0,7),ym=S.statMonth||curM;

  const from=ym+'-01',to=ym+'-'+pad(dim);
  const keys=[];for(let i=1;i<=dim;i++)keys.push(ym+'-'+pad(i));const n=keys.length;
  const os=S.orders.filter(o=>o.status==='active'&&o.date>=from&&o.date<=to);
  const short=v=>v>=1e6?(v/1e6).toFixed(1).replace('.',',').replace(',0','')+' tr':money(v);
  let h='<div class="mnav"><button data-act="statM" data-d="-1" aria-label="Tháng trước"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><b>Tháng '+mm+'/'+yy+'</b><button data-act="statM" data-d="1" aria-label="Tháng sau"'+(ym>=curM?' disabled':'')+'><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div>';

  const perDay={};os.forEach(o=>{perDay[o.date]=(perDay[o.date]||0)+1});
  const mx=Math.max(1,...keys.map(k=>perDay[k]||0));
  const pk=keys.reduce((a,k)=>(perDay[k]||0)>(perDay[a]||0)?k:a,keys[0]);
  h+='<div class="card"><div class="row sb"><h3>Số phần mỗi ngày</h3>'+(perDay[pk]?'<span class="sub">Cao nhất '+fmtDate(pk)+' · '+perDay[pk]+'</span>':'')+'</div><div class="vbars" aria-hidden="true">'+keys.map(k=>'<div'+(k===pk&&perDay[k]?' class="pk"':'')+' title="'+fmtDate(k)+': '+(perDay[k]||0)+'" style="height:'+Math.round((perDay[k]||0)/mx*100)+'%"></div>').join('')+'</div><div class="row sb sub" style="margin-top:6px;font-size:12px"><span>'+fmtDate(from)+'</span><span>'+fmtDate(to)+'</span></div></div>';
  const rank=(l,unit)=>{const m=Math.max(1,l.length?l[0].n:1);return l.length?l.map((x,i)=>'<div class="rk"><span class="rn">'+(i+1)+'</span><div class="rm"><div class="row sb"><span>'+esc(x.name)+'</span><span class="rv">'+x.n+(unit||'')+'</span></div><div class="bar"><i style="width:'+Math.round(x.n/m*100)+'%"></i></div></div></div>').join(''):'<div class="sub">Chưa có dữ liệu.</div>'};
  const cnt={};os.forEach(o=>{cnt[o.dishName]=(cnt[o.dishName]||0)+1});
  const dishes=Object.keys(cnt).map(k=>({name:k,n:cnt[k]})).sort((a,b)=>b.n-a.n).slice(0,5);
  h+='<div class="card"><h3>Món được chọn nhiều</h3>'+rank(dishes)+'</div>';
  const uc={};os.forEach(o=>{uc[o.code]=(uc[o.code]||0)+1});
  const users=Object.keys(uc).map(k=>({name:k,n:uc[k]})).sort((a,b)=>b.n-a.n).slice(0,5);
  h+='<div class="card"><h3>Người đặt nhiều</h3>'+rank(users)+'</div>';
  h+='<div class="card"><div class="row sb"><h3>Công nợ</h3><span class="sub">'+dl.length+' người</span></div>'+(dl.length?dl.slice(0,8).map(c=>'<div class="row sb dbt"><span>'+esc(c)+'</span><span class="rv">'+money(dm[c])+'</span></div>').join('')+(dl.length>8?'<div class="sub" style="margin-top:6px">và '+(dl.length-8)+' người khác — xem ở tab Công nợ</div>':''):'<div class="sub">Không có ai nợ.</div>')+'</div>';
  return h;
}

function toSquare(file){return new Promise((res,rej)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{URL.revokeObjectURL(url);const s=Math.min(img.width,img.height),sx=(img.width-s)/2,sy=(img.height-s)/2;let size=480,q=.85;const cv=document.createElement('canvas'),cx=cv.getContext('2d');
    for(let i=0;i<16;i++){cv.width=cv.height=size;cx.fillStyle='#fff';cx.fillRect(0,0,size,size);cx.drawImage(img,sx,sy,s,s,0,0,size,size);const out=cv.toDataURL('image/jpeg',q);const bytes=Math.round((out.length-23)*3/4);if(bytes<=95000)return res({url:out,bytes:bytes});if(q>.5)q-=.1;else size=Math.round(size*.85)}
    rej(new Error('Ảnh quá lớn, chọn ảnh khác.'))};
  img.onerror=()=>{rej(new Error('Không đọc được ảnh.'))};img.src=url})}

 invF(el){S.invFilter=el.dataset.f;render()},
 markPaid(el){const i=S.invoices.find(x=>x.id===el.dataset.id);if(!i)return;S.sheet={id:i.id};openSheet('<h2>Xác nhận đã nhận tiền?</h2><p><b>'+esc(i.userCode)+'</b> · '+esc(i.code)+'<br><span style="font-size:26px;font-weight:700">'+money(i.total)+'</span></p><button class="btn primary" data-act="markDo">Đã nhận tiền</button><button class="btn ghost full" style="margin-top:10px" data-act="closeSheet">Chưa nhận</button>')},
 markDo(){if(S.payBusy)return;S.payBusy=true;safe(async()=>{try{const ref=S.db.doc('invoices/'+S.sheet.id);const cur=await ref.get();if(!cur.exists){toast('Không tìm thấy hóa đơn.');closeSheet();return}if(cur.data().status!=='unpaid'){closeSheet();toast(cur.data().status==='paid'?'Hóa đơn này đã được xác nhận trước đó.':'Hóa đơn này đã bị hủy.');return}await ref.update({status:'paid',paidAt:Date.now()});closeSheet();toast('Đã xác nhận thanh toán')}finally{S.payBusy=false}})},
 statM(el){const cur=todayKey().slice(0,7);let ym=S.statMonth||cur;let y=Number(ym.slice(0,4)),m=Number(ym.slice(5,7))+Number(el.dataset.d);if(m<1){m=12;y--}if(m>12){m=1;y++}ym=y+'-'+pad(m);if(ym>cur)return;S.statMonth=ym;render()},
 copy(el){const t=el.dataset.t;try{navigator.clipboard.writeText(t).then(()=>toast('Đã sao chép'),()=>toast(t))}catch(e){toast(t)}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=A[el.dataset.act];if(f)f(el,e)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset)return;if(t.dataset.in==='dnote'&&S.draft)S.draft.note=t.value;if(t.dataset.in==='q'){S.q=t.value;applyFilter()}if(t.dataset.in==='invPrev')invPrev()});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset)return;
  if(t.dataset.in==='invPrev')invPrev();
  if(t.dataset.ch==='auto'){safe(async()=>{await S.db.doc('users/'+S.me.phone).update({autoDefault:t.checked});S.me.autoDefault=t.checked;toast(t.checked?'Đã bật tự đặt món mặc định':'Đã tắt tự đặt')})}
  if(t.dataset.ch==='img'&&t.files&&t.files[0]){safe(async()=>{const r=await toSquare(t.files[0]);S.form.img=r.url;$('fprev').innerHTML='<img alt="" src="'+r.url+'">';$('fsize').textContent='Ảnh '+Math.round(r.bytes/1024)+'KB, đã cắt vuông.'})}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.dataset.form;if(f==='login')loginSubmit();else if(f==='pin')pinSubmit();else if(f==='setup')setupSubmit()});

/* ========= login ========= */
const normPhone=p=>{let d=p.replace(/[^\d]/g,'');if(d.indexOf('0084')===0)d='0'+d.slice(4);else if(d.indexOf('84')===0&&d.length>=11&&d.length<=12)d='0'+d.slice(2);return d};
async function finishLogin(admin){
  const L=S.login;
  S.me=await ensureUser(L.name||'Bạn',L.phone);S.role=admin?'admin':'user';
  S.tab=admin?'orders':'menu';S.date=todayKey();S.off=0;
  try{localStorage.setItem('dc_phone',L.phone);localStorage.setItem('dc_name',S.me.name)}catch(e){}
  subsAfter();render();
}
function loginSubmit(){safe(async()=>{
  const name=val('ln').replace(/\s+/g,' '),phone=normPhone(val('lp'));
  if(!name){toast('Nhập tên của bạn.');return}
  if(phone.length<9||phone.length>12){toast('Số điện thoại chưa đúng.');return}
  const L=S.login;L.name=name;L.phone=phone;
  const s=await S.db.doc('meta/settings').get();const st=s.exists?s.data():null;S.settings=st;
  if(!st||!st.adminPhone){L.step='setup';render();return}
  if(st.adminPhone===phone){L.step='pin';render();return}
  await finishLogin(false);
})}
function pinSubmit(){safe(async()=>{const h=await hashPin(val('lpin'));const ok=await S.db.adminLogin(S.login.phone,h);if(!ok){toast('Sai mã PIN.');return}await finishLogin(true)})}
function setupSubmit(){safe(async()=>{const p=val('lpin');if(!/^\d{4,8}$/.test(p)){toast('PIN gồm 4–8 chữ số.');return}
  const ref=S.db.doc('meta/settings');const cur=await ref.get();if(cur.exists&&cur.data().adminPhone){toast('Đã có admin.');S.login.step='form';render();return}
  await ref.set({adminPhone:S.login.phone,adminName:S.login.name,pinHash:await hashPin(p),cutoff:'10:00',bank:{bin:'',acc:'',name:''}});
  S.settings=(await ref.get()).data();await finishLogin(true)})}

/* ========= boot ========= */
(async function(){
  try{const d=await claude.use('db');S.db=d||null}catch(e){S.db=null}
  try{S.dl=await claude.use('downloads')}catch(e){S.dl=null}
  try{S.login.name=localStorage.getItem('dc_name')||'';S.login.phone=localStorage.getItem('dc_phone')||''}catch(e){}
  if(S.db)subsBase();
  render();
  setInterval(()=>{if(S.me&&$('modal').hidden&&(S.tab==='menu'||S.tab==='orders'))render()},30000);
})();
</script>
</body>
